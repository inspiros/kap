[workspace]
resolver = "3"
members = ["crates/kap-solver", "crates/kap-python"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Hoang-Nhat Tran (inspiros)"]
repository = "https://github.com/inspiros/kap"

[workspace.dependencies]
kap-solver = { path = "crates/kap-solver", version = "=0.3.0-alpha.1" }
ndarray = "0.17"
numpy = "0.30"
proptest = "1.12"
pyo3 = "0.30"
rayon = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
