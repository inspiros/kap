<svg xmlns="http://www.w3.org/2000/svg" width="480" height="370" viewBox="0 0 480 370" role="img" aria-labelledby="title desc">
  <title id="title">An optimal 3-partite assignment</title>
  <desc id="desc">Three sets of three vertices with all 27 candidate edges. Three colored triangles form an assignment with costs 23, 4, and 11, totaling 38.</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .neutral { fill: #8b949e; }
    .candidates { fill: none; stroke: #8b949e; stroke-width: 1; stroke-opacity: .28; }
    .chosen { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .index { fill: white; font-size: 12px; font-weight: 650; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Each path lists the three edges from one vertex to the next partite. -->
  <g class="candidates">
    <!-- P0 to P1 -->
    <path d="M70 85 L240 85 M70 85 L240 175 M70 85 L240 265"/>
    <path d="M70 175 L240 85 M70 175 L240 175 M70 175 L240 265"/>
    <path d="M70 265 L240 85 M70 265 L240 175 M70 265 L240 265"/>
    <!-- P1 to P2 -->
    <path d="M240 85 L410 85 M240 85 L410 175 M240 85 L410 265"/>
    <path d="M240 175 L410 85 M240 175 L410 175 M240 175 L410 265"/>
    <path d="M240 265 L410 85 M240 265 L410 175 M240 265 L410 265"/>
    <!-- P0 to P2 -->
    <path d="M70 85 Q240 15 410 85 M70 85 Q240 170 410 175 M70 85 Q240 215 410 265"/>
    <path d="M70 175 Q240 170 410 85 M70 175 Q240 110 410 175 M70 175 Q240 260 410 265"/>
    <path d="M70 265 Q240 215 410 85 M70 265 Q240 260 410 175 M70 265 Q240 325 410 265"/>
  </g>

  <!-- The three selected cliques: (0,1,0), (1,0,1), (2,2,2). -->
  <g class="chosen">
    <path stroke="#0072b2" d="M70 85 L240 175 L410 85 Q240 15 70 85"/>
    <path stroke="#d55e00" d="M70 175 L240 85 L410 175 Q240 110 70 175"/>
    <path stroke="#009e73" d="M70 265 L240 265 L410 265 Q240 325 70 265"/>
  </g>

  <g class="neutral" font-size="14" font-weight="600" text-anchor="middle">
    <text x="70" y="38">P0</text><text x="240" y="38">P1</text><text x="410" y="38">P2</text>
  </g>
  <!-- Vertex colors identify the clique; numbers are vertex indices. -->
  <g>
    <circle cx="70" cy="85" r="15" fill="#0072b2"/><circle cx="240" cy="175" r="15" fill="#0072b2"/><circle cx="410" cy="85" r="15" fill="#0072b2"/>
    <circle cx="70" cy="175" r="15" fill="#d55e00"/><circle cx="240" cy="85" r="15" fill="#d55e00"/><circle cx="410" cy="175" r="15" fill="#d55e00"/>
    <circle cx="70" cy="265" r="15" fill="#009e73"/><circle cx="240" cy="265" r="15" fill="#009e73"/><circle cx="410" cy="265" r="15" fill="#009e73"/>
  </g>
  <g class="index">
    <text x="70" y="85">0</text><text x="70" y="175">1</text><text x="70" y="265">2</text>
    <text x="240" y="85">0</text><text x="240" y="175">1</text><text x="240" y="265">2</text>
    <text x="410" y="85">0</text><text x="410" y="175">1</text><text x="410" y="265">2</text>
  </g>
  <!-- Clique costs follow the same color order as the highlighted edges. -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <text x="105" y="330" fill="#0072b2">23</text>
    <text x="185" y="330" fill="#d55e00">4</text>
    <text x="265" y="330" fill="#009e73">11</text>
    <text x="372" y="330" class="neutral">total 38</text>
  </g>
</svg>
