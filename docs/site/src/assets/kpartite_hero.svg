<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">kap — k-partite assignment in Python and Rust</title>
  <desc id="desc">Three parts with three vertices each, partitioned into three colored cliques. Each clique contains one vertex from each part and all three pairwise edges. Colors indicate clique membership; crossings are not vertices. This is an illustrative partition, not a claim of optimality.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d4e2da"/></pattern>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f6f8f2"/><stop offset="1" stop-color="#eaf3ed"/></linearGradient>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#paper)"/>
  <rect x="716" y="40" width="684" height="480" rx="18" fill="url(#grid)"/>
  <path d="M680 64V496" stroke="#d1ded5"/>
  <g transform="translate(64 80) scale(0.9166666666666666)">
    <rect width="96" height="96" rx="24" fill="#193d38"/>
    <path d="M28 24V72M68 27L28 51L69 72" fill="none" stroke="#96ddc6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f4faf5"><circle cx="28" cy="24" r="5"/><circle cx="28" cy="51" r="5"/><circle cx="28" cy="72" r="5"/><circle cx="68" cy="27" r="5"/><circle cx="69" cy="72" r="5"/></g>
  </g>
  <g font-family="Inter, DejaVu Sans, sans-serif" fill="#193d38">
    <text x="175" y="154" font-size="100" font-weight="650" letter-spacing="-6">kap</text>
    <text x="64" y="265" font-size="40" font-weight="550" letter-spacing="-1.3">k-partite assignment</text>
    <text x="66" y="315" font-size="24" fill="#536c62">Partition vertices into cliques.</text>
    <text x="66" y="351" font-size="24" fill="#536c62">Minimize total pairwise cost.</text>
  </g>
  <path d="M66 403H120" stroke="#16776d" stroke-width="3"/>
  <text x="66" y="452" font-family="DejaVu Sans Mono, monospace" font-size="18" letter-spacing="1.5" fill="#536c62">PYTHON / RUST</text>
  <g fill="#ffffff" fill-opacity=".62" stroke="#d1ded5">
    <rect x="782" y="124" width="72" height="312" rx="36"/>
    <rect x="1000" y="124" width="72" height="312" rx="36"/>
    <rect x="1218" y="124" width="72" height="312" rx="36"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#657a70" text-anchor="middle">
    <text x="818" y="96">V₀</text><text x="1036" y="96">V₁</text><text x="1254" y="96">V₂</text>
  </g>
  <!-- Each triangle is a complete clique: all three pairwise edges are shown. -->
  <path d="M818 280L1036 160L1254 400Z" fill="#617b9a" fill-opacity=".045" stroke="#617b9a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M818 400L1036 400L1254 280Z" fill="#b18159" fill-opacity=".06" stroke="#b18159" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M818 160L1036 280L1254 160Q1036 104 818 160Z" fill="#16776d" fill-opacity=".1" stroke="#16776d" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="#16776d" stroke="#f3f7f0" stroke-width="4">
    <circle cx="818" cy="160" r="10"/>
    <circle cx="1036" cy="280" r="10"/>
    <circle cx="1254" cy="160" r="10"/>
  </g>
  <g fill="#617b9a" stroke="#f3f7f0" stroke-width="4">
    <circle cx="818" cy="280" r="10"/>
    <circle cx="1036" cy="160" r="10"/>
    <circle cx="1254" cy="400" r="10"/>
  </g>
  <g fill="#b18159" stroke="#f3f7f0" stroke-width="4">
    <circle cx="818" cy="400" r="10"/>
    <circle cx="1036" cy="400" r="10"/>
    <circle cx="1254" cy="280" r="10"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#536c62">
    <text x="790" y="491">3 PARTS</text><text x="936" y="491" fill="#a5b7ac">→</text><text x="984" y="491">3 DISJOINT CLIQUES</text>
  </g>
</svg>
