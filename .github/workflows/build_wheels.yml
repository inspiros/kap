name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# A newer push to the same branch or PR cancels the older build.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-sdist
          path: dist/*.tar.gz

  wheels:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          # Intel macOS runners are scarce and often queue for hours;
          # cross-compile the x86_64 wheel on Apple silicon instead.
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # abi3-py310 wheels: any newer interpreter builds them
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  test:
    needs: wheels
    # ubuntu-24.04: setup-python builds for 3.10 (EOL 2026-10) may be missing on 26.04
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check
      - uses: actions/download-artifact@v4
        with:
          name: artifact-wheel-ubuntu-latest-x86_64
          path: dist
      - run: python -m pip install dist/*.whl pytest scipy lap lapjv munkres
      - run: python -m pytest -q

