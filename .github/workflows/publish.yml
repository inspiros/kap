name: Publish

# Manual only: Actions > Publish > Run workflow, then pick the release tag (v*) as the ref.
on:
  workflow_dispatch:

jobs:
  check_ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a v* tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Publishing $GITHUB_REF_NAME" ;;
            *) echo "::error::Run this workflow on a release tag (v*), not $GITHUB_REF"; exit 1 ;;
          esac

  build:
    needs: check_ref
    uses: ./.github/workflows/build_wheels.yml

  publish_on_pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true
      - name: Check that the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          for f in dist/*; do
            case "$(basename "$f")" in
              kap-"$version"-*|kap-"$version".tar.gz) ;;
              *) echo "::error::$f does not match tag $GITHUB_REF_NAME"; exit 1 ;;
            esac
          done
      # Uses the repository secret PYPI_PASSWORD (a PyPI API token) when set;
      # if it is empty, falls back to trusted publishing (id-token above).
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_password }}

  publish_on_crates_io:
    # Runs after PyPI so a failed wheel build or upload never leaves a crate-only release.
    needs: publish_on_pypi
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kap-solver") | .version')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::kap-solver $version does not match tag $GITHUB_REF_NAME"; exit 1; }
      - run: cargo publish -p kap-solver --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
