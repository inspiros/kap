[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "kap"
dynamic = ["version"]
description = "Gabrovšek's Multiple Hungarian method for solving k-Assignment Problem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Hoang-Nhat Tran (inspiros)", email = "hnhat.tran@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["k-assignment", "k-partite-matching", "linear-assignment", "bi-partite-matching", "hungarian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
scipy = ["scipy"]
lap = ["lap"]
lapjv = ["lapjv"]
munkres = ["munkres"]
test = ["pytest", "scipy", "lap", "lapjv", "munkres"]

[project.urls]
Source = "https://github.com/inspiros/kap"
Download = "https://pypi.org/project/kap"

[tool.maturin]
manifest-path = "crates/kap-python/Cargo.toml"
python-source = "python"
module-name = "kap._core"
include = [
    { path = "Cargo.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "crates/**/*", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "LICENSE.txt", format = "sdist" },
]
exclude = ["target/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
