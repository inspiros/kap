[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kap"
dynamic = ["version"]
description = "Gabrovšek's Multiple Hungarian method for solving k-Assignment Problem."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Hoang-Nhat Tran (inspiros)", email = "hnhat.tran@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["numpy"]
keywords = ["k-assignment", "k-partite-matching", "linear-assignment", "bi-partite-matching", "hungarian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
scipy = ["scipy"]
lap = ["lap"]
lapjv = ["lapjv"]
munkres = ["munkres"]
test = ["pytest", "scipy", "lap", "lapjv", "munkres"]

[project.urls]
Source = "https://github.com/inspiros/kap"
Download = "https://pypi.org/project/kap"

[tool.setuptools.packages.find]
include = ["kap*"]

[tool.setuptools.dynamic]
version = { attr = "kap._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
